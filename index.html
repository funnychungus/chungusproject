<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video game</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: white;
      font-family: sans-serif;
    }

    video {
      display: block;
      width: min(90vw, 800px);
      max-height: 80vh;
      background: black;
    }
  </style>
</head>
<body>
  <main>
    <h1>Video game</h1>
    <video id="gameVideo" controls autoplay muted playsinline></video>
    <p id="status" aria-live="polite">Loading video…</p>
  </main>

  <script>
    const videos = [
      "https://files.catbox.moe/t9xtm5.mp4",
      "https://files.catbox.moe/1ryfvi.mov",
      "https://files.catbox.moe/i5wyuu.mov"
    ];

    const player = document.getElementById("gameVideo");
    const status = document.getElementById("status");
    const source = videos[Math.floor(Math.random() * videos.length)];

    player.src = source;
    player.play().then(() => {
      status.textContent = "Video playing (muted).";
    }).catch(() => {
      status.textContent = "Autoplay was blocked. Press Play to start.";
    });
  </script>
</body>
</html>
